name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an in-progress production deploy. A Pages API 503 needs
# the retry window below, and a newer push should wait rather than kill it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy4.outputs.page_url || steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unlisted HP-only site
        run: |
          mkdir -p dist/ua
          cp -a ua/. dist/ua/
          touch dist/.nojekyll
          cat > dist/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF
          cat > dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="robots" content="noindex, nofollow, noarchive">
            <meta name="referrer" content="no-referrer">
            <title></title>
          </head>
          <body></body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # actions/deploy-pages talks to the Pages API. During GitHub incidents
      # that call returns 503 ("No server is currently available") and the
      # live site stays on the previous commit — as with abdc731 (logo align).
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before Pages retry
        if: steps.deployment.outcome != 'success'
        run: sleep 30

      - name: Retry deploy to GitHub Pages
        id: deploy2
        if: steps.deployment.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before Pages retry (2)
        if: steps.deployment.outcome != 'success' && steps.deploy2.outcome != 'success'
        run: sleep 60

      - name: Retry deploy to GitHub Pages (2)
        id: deploy3
        if: steps.deployment.outcome != 'success' && steps.deploy2.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before Pages retry (final)
        if: steps.deployment.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success'
        run: sleep 120

      - name: Retry deploy to GitHub Pages (final)
        id: deploy4
        if: steps.deployment.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success'
        uses: actions/deploy-pages@v5
