name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unlisted HP-only site
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -a ua/. dist/
          touch dist/.nojekyll
          printf '%s\n' 'User-agent: *' 'Disallow: /' > dist/robots.txt
          # Old /ua/ URL still works; do not duplicate large assets.
          mkdir -p dist/ua
          cat > dist/ua/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="robots" content="noindex, nofollow, noarchive">
            <meta name="referrer" content="no-referrer">
            <meta http-equiv="refresh" content="0; url=../">
            <title></title>
            <script>location.replace("../");</script>
          </head>
          <body></body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
